name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: bun install (root)
        run: bun install

      - name: Build plugin (@titxue/dsh-desktop-host)
        working-directory: plugins/desktop-host
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json

      - name: Assemble desktop plugin resources
        run: |
          mkdir -p bootstrap/plugin/@titxue/dsh-desktop-host
          cp plugins/desktop-host/package.json bootstrap/plugin/@titxue/dsh-desktop-host/
          cp -r plugins/desktop-host/lib bootstrap/plugin/@titxue/dsh-desktop-host/
          cp plugins/desktop-host/desktop.yml bootstrap/desktop.yml

      - name: Tauri build (${{ matrix.bundles }})
        run: bunx tauri build --bundles ${{ matrix.bundles }}

      - name: Ad-hoc sign macOS app and repack dmg
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - "src-tauri/target/release/bundle/macos/DeepSeek Harness.app"
          hdiutil create -volname "DeepSeek Harness" -srcfolder "src-tauri/target/release/bundle/macos/DeepSeek Harness.app" -ov -format UDZO "src-tauri/target/release/bundle/dmg/DeepSeek Harness_0.1.0_aarch64.dmg"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
